name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (String Catalog compilation needs a recent toolchain)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          xcrun --find xcstringstool   # String Catalog compiler; fails loudly if Xcode is not selected

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          swift build --build-system swiftbuild -c debug
          swift build --build-system swiftbuild -c debug --product adk

      - name: Localization lint (catalog vs code, vi/en complete)
        run: python3 -I scripts/l10n-extract.py --check

      - name: Localization vi files match the catalog
        run: scripts/l10n-regen.sh --verify

      - name: Test
        run: swift test --build-system swiftbuild --parallel

  bench:
    name: Benchmarks (non-blocking)
    # Never gates a PR: perf numbers on shared runners are noisy (#110). Runs on pushes to main and by hand.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Run benchmarks
        env:
          ADK_BENCH: "1"
          ADK_BENCH_OUT: ${{ runner.temp }}/bench.txt
        run: swift test --build-system swiftbuild --filter Benchmark
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: ${{ runner.temp }}/bench.txt
          if-no-files-found: ignore
          retention-days: 30

  package:
    name: Package .app
    needs: build-test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # build number from commit count
      - name: Select Xcode (String Catalog compilation needs the Swift Build engine, Swift 6.2+)
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Cache SwiftPM build (release)
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-release-${{ runner.os }}-
      - name: Lint scripts and packaging
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          plutil -lint Packaging/Info.plist Packaging/AIDiskKeeper.entitlements
          ./scripts/sign-app.sh -h >/dev/null && ./scripts/notarize.sh -h >/dev/null && ./scripts/make-dmg.sh -h >/dev/null && ./scripts/render-release-notes.sh -h >/dev/null
      - name: Unsigned DMG smoke test
        run: |
          ./scripts/make-app.sh --config debug --output "$RUNNER_TEMP/dmgtest" --skip-verify
          ./scripts/make-dmg.sh "$RUNNER_TEMP/dmgtest/AI Disk Keeper.app" "$RUNNER_TEMP/dmgtest/test.dmg"
          hdiutil imageinfo "$RUNNER_TEMP/dmgtest/test.dmg" >/dev/null
          test -s "$RUNNER_TEMP/dmgtest/AI Disk Keeper.app/Contents/Resources/AppIcon.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$RUNNER_TEMP/dmgtest/AI Disk Keeper.app/Contents/Info.plist")" = AppIcon
      - name: Sign (ad-hoc, relative path) and release-notes smoke test
        run: |
          cp -R "$RUNNER_TEMP/dmgtest/AI Disk Keeper.app" "$RUNNER_TEMP/dmgtest/signme.app"
          cd "$RUNNER_TEMP/dmgtest" && SIGN_IDENTITY=- "$GITHUB_WORKSPACE/scripts/sign-app.sh" signme.app && cd "$GITHUB_WORKSPACE"
          printf 'aaa  one.dmg\nbbb  one.zip\n' > "$RUNNER_TEMP/sums.txt"
          ./scripts/render-release-notes.sh 9.9.9 "UNSIGNED" "$RUNNER_TEMP/sums.txt" "$RUNNER_TEMP/notes.md"
          grep -q 'bbb  one.zip' "$RUNNER_TEMP/notes.md"
          grep -q 'AI-Disk-Keeper-9.9.9.dmg' "$RUNNER_TEMP/notes.md"
      - name: Build .app
        run: BUILD_NUMBER=${{ github.run_number }} ./scripts/make-app.sh --config release --universal --zip --output dist
      - name: Smoke-launch .app
        run: |
          open -n "dist/AI Disk Keeper.app"
          for i in $(seq 1 20); do pgrep -f "AI Disk Keeper.app/Contents/MacOS/AIDiskKeeper" && break; sleep 0.5; done
          sleep 3
          pgrep -f "AI Disk Keeper.app/Contents/MacOS/AIDiskKeeper" || { echo "app exited early"; log show --last 2m --predicate 'process == "AIDiskKeeper"' | tail -50; exit 1; }
          pkill -f "AI Disk Keeper.app/Contents/MacOS/AIDiskKeeper" || true
      - name: Upload artifact (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Disk-Keeper-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
