name: Release

# Tag-triggered release: Developer ID signing, notarization, stapling, DMG, GitHub Release.
# Never add a pull_request trigger here: secrets must not be exposed to PRs.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build/sign/notarize but do not create a release"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write   # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode (String Catalog compilation needs the Swift Build engine, Swift 6.2+)
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Version
        env:
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          CORE_VERSION=$(sed -n 's/.*static let version = "\([^"]*\)".*/\1/p' Sources/DiskKeeperCore/DiskKeeperCore.swift | head -1)
          DRY_RUN=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            BASE="${VERSION%%-*}"
            if [ "$VERSION" != "$BASE" ]; then PRERELEASE=true; else PRERELEASE=false; fi
            echo "TAG=$TAG" >> "$GITHUB_ENV"
          else
            BASE="$CORE_VERSION"
            VERSION="$BASE-dev.${GITHUB_RUN_NUMBER}"
            PRERELEASE=false
            DRY_RUN=true
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRY_RUN" = "true" ]; then DRY_RUN=true; fi
          if [ "$BASE" != "$CORE_VERSION" ]; then
            echo "::error::bump DiskKeeperCore.version to $BASE before tagging (currently $CORE_VERSION)"
            exit 1
          fi
          { echo "VERSION=$VERSION"; echo "BASE=$BASE"; echo "PRERELEASE=$PRERELEASE"; echo "DRY_RUN=$DRY_RUN"; } >> "$GITHUB_ENV"
          echo "version=$VERSION base=$BASE prerelease=$PRERELEASE dry_run=$DRY_RUN"

      - name: Preflight credentials
        id: creds
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_P8: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          KEY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          # Only names are ever printed, never values.
          if [ -z "$P12$P12_PASSWORD$TEAM_ID$KEY_P8$KEY_ID$KEY_ISSUER$APPLE_ID$APP_PASSWORD" ]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::notice title=Unsigned build::Apple signing secrets not configured; see docs/RELEASING.md"
            exit 0
          fi
          missing=()
          [ -n "$P12" ] || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          [ -n "$P12_PASSWORD" ] || missing+=(MACOS_CERTIFICATE_PASSWORD)
          [ -n "$TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          notary=""
          if [ -n "$KEY_P8" ] || [ -n "$KEY_ID" ] || [ -n "$KEY_ISSUER" ]; then
            notary=apikey
            [ -n "$KEY_P8" ] || missing+=(NOTARY_API_KEY_P8_BASE64)
            [ -n "$KEY_ID" ] || missing+=(NOTARY_API_KEY_ID)
            [ -n "$KEY_ISSUER" ] || missing+=(NOTARY_API_ISSUER_ID)
          elif [ -n "$APPLE_ID" ] || [ -n "$APP_PASSWORD" ]; then
            notary=appleid
            [ -n "$APPLE_ID" ] || missing+=(NOTARY_APPLE_ID)
            [ -n "$APP_PASSWORD" ] || missing+=(NOTARY_APP_PASSWORD)
          else
            missing+=("notary credentials (NOTARY_API_KEY_P8_BASE64+NOTARY_API_KEY_ID+NOTARY_API_ISSUER_ID, or NOTARY_APPLE_ID+NOTARY_APP_PASSWORD)")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Incomplete signing secrets::Missing: ${missing[*]}. Set all of them or none (see docs/RELEASING.md)."
            exit 1
          fi
          echo "mode=full" >> "$GITHUB_OUTPUT"
          echo "notary=$notary" >> "$GITHUB_OUTPUT"

      - name: Toolchain, build and test
        run: |
          set -euo pipefail
          swift --version
          swift build --build-system swiftbuild -c release
          swift test --build-system swiftbuild --parallel

      - name: Build app
        run: |
          set -euo pipefail
          BUILD_NUMBER=$(git rev-list --count HEAD) VERSION="$BASE" ./scripts/make-app.sh --config release --universal --output dist

      - name: Import signing certificate
        if: steps.creds.outputs.mode == 'full'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY_SECRET: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/aidk-signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          KP=$(openssl rand -hex 24)
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          ( umask 077; printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12" )
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          if [ -n "$IDENTITY_SECRET" ]; then
            IDENTITY="$IDENTITY_SECRET"
          else
            MATCHES=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" || true)
            COUNT=$(printf '%s\n' "$MATCHES" | grep -c . || true)
            if [ "$COUNT" -ne 1 ]; then
              echo "::error::expected exactly one 'Developer ID Application' identity in the keychain, found $COUNT; set MACOS_SIGNING_IDENTITY"
              exit 1
            fi
            IDENTITY=$(printf '%s\n' "$MATCHES" | sed -n 's/.*"\(.*\)".*/\1/p')
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using identity: $IDENTITY"

      - name: Notary key file
        if: steps.creds.outputs.mode == 'full' && steps.creds.outputs.notary == 'apikey'
        env:
          KEY_P8: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          ( umask 077; printf '%s' "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8" )
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Sign app
        if: steps.creds.outputs.mode == 'full'
        run: ./scripts/sign-app.sh "dist/AI Disk Keeper.app"

      - name: Notarize and staple app
        if: steps.creds.outputs.mode == 'full'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "dist/AI Disk Keeper.app" "$RUNNER_TEMP/notarize-app.zip"
          ./scripts/notarize.sh "$RUNNER_TEMP/notarize-app.zip"
          xcrun stapler staple "dist/AI Disk Keeper.app"
          xcrun stapler validate "dist/AI Disk Keeper.app"

      - name: Final zip
        run: ditto -c -k --sequesterRsrc --keepParent "dist/AI Disk Keeper.app" "dist/AI-Disk-Keeper-$VERSION.zip"

      - name: Build DMG
        run: ./scripts/make-dmg.sh "dist/AI Disk Keeper.app" "dist/AI-Disk-Keeper-$VERSION.dmg"

      - name: Notarize and staple DMG
        if: steps.creds.outputs.mode == 'full'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ./scripts/notarize.sh "dist/AI-Disk-Keeper-$VERSION.dmg"
          xcrun stapler staple "dist/AI-Disk-Keeper-$VERSION.dmg"
          xcrun stapler validate "dist/AI-Disk-Keeper-$VERSION.dmg"

      - name: Verify
        env:
          MODE: ${{ steps.creds.outputs.mode }}
        run: |
          set -euo pipefail
          APP="dist/AI Disk Keeper.app"
          DMG="dist/AI-Disk-Keeper-$VERSION.dmg"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$MODE" = full ]; then
            codesign -dvv "$APP" 2>&1 | tee "$RUNNER_TEMP/cs.txt"
            grep -Eq 'flags=0x[0-9a-f]+\(.*runtime' "$RUNNER_TEMP/cs.txt" || { echo "::error::hardened runtime flag missing"; exit 1; }
            grep -q 'Authority=Developer ID Application' "$RUNNER_TEMP/cs.txt" || { echo "::error::not signed with Developer ID Application"; exit 1; }
            spctl --assess --type execute -vv "$APP" 2>&1 | tee "$RUNNER_TEMP/spctl-app.txt"
            grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl-app.txt" || { echo "::error::app is not accepted as Notarized Developer ID"; exit 1; }
            spctl --assess --type open --context context:primary-signature -vv "$DMG" 2>&1 | tee "$RUNNER_TEMP/spctl-dmg.txt"
            grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl-dmg.txt" || { echo "::error::dmg is not accepted as Notarized Developer ID"; exit 1; }
          fi
          MNT="$RUNNER_TEMP/m"
          mkdir -p "$MNT"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          rc=0
          "$MNT/AI Disk Keeper.app/Contents/MacOS/AIDiskKeeper" --verify-resources || rc=$?
          hdiutil detach "$MNT" || true
          exit $rc

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AI-Disk-Keeper-${{ env.VERSION }}-${{ steps.creds.outputs.mode }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Render release notes
        env:
          MODE: ${{ steps.creds.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = full ]; then
            STATUS="Signed with Developer ID and notarized by Apple."
          else
            STATUS="⚠️ UNSIGNED build (ad-hoc). Gatekeeper will block it; for testing only."
          fi
          ./scripts/render-release-notes.sh "$VERSION" "$STATUS" dist/SHA256SUMS.txt "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        if: github.ref_type == 'tag' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.creds.outputs.mode }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$PRERELEASE" = true ]; then FLAGS+=(--prerelease); fi
          if [ "$MODE" != full ]; then FLAGS+=(--draft); fi
          gh release create "$TAG" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
            --title "AI Disk Keeper $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes --verify-tag ${FLAGS[@]+"${FLAGS[@]}"}

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
            security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
